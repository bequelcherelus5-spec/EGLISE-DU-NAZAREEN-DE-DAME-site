<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700" fill="none">
  <defs>
    <linearGradient id="bgPast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b33"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="700" fill="url(#bgPast)"/>
  <rect x="20" y="20" width="560" height="660" stroke="#d4af37" stroke-width="2" rx="12" fill="none"/>
  
  <!-- Silhouette / Dignified pastoral badge -->
  <circle cx="300" cy="240" r="100" fill="#142c52" stroke="#d4af37" stroke-width="3"/>
  <!-- Pastoral cross emblem -->
  <path d="M300 180 V300 M260 220 H340" stroke="#d4af37" stroke-width="8" stroke-linecap="round"/>
  
  <text x="300" y="400" font-family="'Cinzel', serif" font-size="28" font-weight="700" fill="#fef3c7" text-anchor="middle">
    Pasteur Bequel CHERELUS
  </text>
  <text x="300" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="500" fill="#d4af37" text-anchor="middle">
    Pasteur Titulaire &amp; Berger depuis 2003
  </text>
  
  <rect x="100" y="480" width="400" height="1" fill="#d4af37" opacity="0.4"/>
  
  <text x="300" y="530" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">
    ÉGLISE DU NAZARÉEN DE DAMÉ
  </text>
  <text x="300" y="565" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    Photo officielle pastorale • Archives secrétariat
  </text>
  <text x="300" y="620" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#d4af37" text-anchor="middle">
    Remplaçable dans l'Espace Secrétariat
  </text>
</svg>
